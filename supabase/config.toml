# Minimal Supabase CLI configuration for NutriFit.
# Project ref: nelxdqlcykxcfczetftd (owner must confirm before linking).
project_id = "nutrifit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["nutrifit://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[functions.generate-diet-plan]
verify_jwt = true

[functions.replace-meal]
verify_jwt = true

[functions.suggest-food-alternatives]
verify_jwt = true

[functions.explain-meal]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
